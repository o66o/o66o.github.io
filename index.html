<h1>JobHunter</h1>
<p>JobHunter is a personal, single-user tool run by Yuri Gorskiy on his own computer. It reads job-alert emails in its owner's Gmail account (read-only) to collect links to job postings for his own job search.</p>
<p>It is not offered to other users.</p>
